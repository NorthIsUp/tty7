# The same commands CI runs (.github/workflows/ci.yml), under mise.
[tools]
rust = "stable"

[tasks.build]
run = "cargo build --locked"

[tasks.test]
description = "Tests; extra args go to cargo test (e.g. `mise run test -p tty7-core`)"
run = "cargo test --locked"

[tasks.fmt]
run = "cargo fmt"

[tasks.check]
description = "What CI gates on: fmt, then build and test"
run = ["cargo fmt --check", "cargo build --locked", "cargo test --locked"]

[tasks.run]
run = "cargo run --locked --bin tty7-app"

[tasks.sync-upstream]
description = "Rebase the current branch onto upstream/main; FORK.md lists the hooks a conflict touches"
run = 'git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/l0ng-ai/tty7.git; git fetch upstream main && git rebase upstream/main || { echo "conflict: resolve using the FORK.md hook table, then git rebase --continue"; exit 1; }'
